name: Friends

# Friend submissions: a "Friend request" issue → validate → append to
# src/data/friends.json → rebuild and deploy the site.

on:
  issues:
    types: [ opened, labeled ]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  add-friend:
    if: contains(github.event.issue.labels.*.name, 'friend-request')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: add
        uses: actions/github-script@v9
        with:
          script: |
            const addFriend = require('./.github/scripts/add-friend.cjs');
            await addFriend({ github, context, core });

      - id: commit
        if: steps.add.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/friends.json src/assets/friends
          git commit -m "friends: add ${{ steps.add.outputs.name }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Thank and close
        uses: actions/github-script@v9
        with:
          script: |
            const name = '${{ steps.add.outputs.name }}';
            const added = '${{ steps.commit.outputs.changed }}' === 'true';
            const body = added
              ? `**Welcome aboard, ${name}!** 🎉\n\nYou've been added to [the friends page](https://shiina.xyz/friends/) — it rebuilds and deploys in a minute or two.`
              : 'Issue closed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

  build:
    needs: add-friend
    if: needs.add-friend.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
